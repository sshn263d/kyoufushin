</style></head><body><div class="mobilebar"><b>恐怖心展・43 項主題</b><button id="menu" aria-label="開啟目錄">☰ 目錄</button></div><div class="layout"><aside class="side" id="side"><div class="brand">恐怖心展</div><div class="sub">繁體中文・作品導覽</div><input id="search" placeholder="搜尋中文 / 日本語 / Phobia…" aria-label="搜尋恐懼症"><div class="filters" id="filters"></div><nav id="nav"></nav></aside><main class="main" id="top"><div class="lead"><div class="sub">KYOUFUSHIN EXHIBITION • 43 SUBJECTS</div><h1>恐怖心展</h1><p>43 項恐懼主題的繁體中文互動導覽，保留日文原名及英文名稱。搜尋名稱、以類別篩選，或按目錄直接跳到指定作品。</p><div class="tools"><span class="pill">可直接離線閱讀</span><span class="pill">43 個固定錨點</span><span class="pill">手機版目錄</span></div><div class="notice">這份單頁版採用<strong>精簡展品導覽</strong>格式；完整逐段翻譯已於對話中提供。展覽描述及案例依照原文整理，並未獨立核實。</div></div><div id="sections"></div><footer>來源：<a href="https://kyoufushin.com/caption-5c2c9901cdff/" target="_blank" rel="noopener noreferrer">恐怖心展官方作品解說</a>。本頁為非官方繁體中文導覽。</footer></main></div><a href="#top" class="toplink" aria-label="回到頁首">↑</a><script>const ITEMS=[{"id": "phobia-01", "no": 1, "zh": "先端恐懼症", "jp": "先端に対する恐怖心", "en": "Aichmophobia", "cat": "存在", "desc": "害怕剪刀、鉛筆、牙籤等尖銳物體；即使桌上的筆朝向自己，也可能引發恐懼。", "ex": "各種物體的尖端", "story": "個別人士對不同尖端的恐懼程度並不相同。"}, {"id": "phobia-02", "no": 2, "zh": "密集物體恐懼症", "jp": "集合体に対する恐怖心", "en": "Trypophobia", "cat": "存在", "desc": "害怕蜂巢、蓮蓬或電路板等密集排列的孔洞與形狀。", "ex": "引發密集恐懼的圖片", "story": "三名人士均因偶然看到社交媒體圖片而意識到自己的恐懼，當中包括普通雨滴照片。"}, {"id": "phobia-03", "no": 3, "zh": "牙科恐懼症", "jp": "歯科に対する恐怖心", "en": "Dentophobia", "cat": "存在", "desc": "對牙科治療、牙科器械或牙齒本身感到恐懼。", "ex": "被帶回家的牙齒", "story": "男性把拔下來的恆齒帶回家留念，卻令原本就害怕牙醫的妹妹產生強烈抗拒。"}, {"id": "phobia-04", "no": 4, "zh": "氣球恐懼症", "jp": "風船に対する恐怖心", "en": "Globophobia", "cat": "存在", "desc": "通常源於對氣球爆破的預期性焦慮，甚至可能害怕氣球氣味或造型。", "ex": "巨大氣球", "story": "某電視整人節目使用巨大氣球，使藝人驚慌到片段不適合播出。"}, {"id": "phobia-05", "no": 5, "zh": "蜘蛛恐懼症", "jp": "蜘蛛に対する恐怖心", "en": "Arachnophobia", "cat": "存在", "desc": "即使是圖片或卡通化的蜘蛛，也可能帶來強烈焦慮。", "ex": "暗示蜘蛛存在的圖片", "story": "一名男子看到時鐘後方露出長蜘蛛腳的網絡圖片後，開始極度害怕蜘蛛。"}, {"id": "phobia-06", "no": 6, "zh": "微生物恐懼症", "jp": "微生物に対する恐怖心", "en": "Bacillophobia", "cat": "存在", "desc": "對細菌、微生物及可能滋生它們的環境感到恐懼。", "ex": "小學保健通訊", "story": "女性兒時看到手上細菌的圖片受驚，此後養成頻繁消毒的習慣。"}, {"id": "phobia-07", "no": 7, "zh": "布偶裝恐懼症", "jp": "着ぐるみに対する恐怖心", "en": "Maskaphobia", "cat": "存在", "desc": "對真人大小的吉祥物、面具及布偶裝角色產生不合理的強烈恐懼。", "ex": "與布偶裝角色拍攝的合照", "story": "女子幼年與吉祥物合照後痛哭；雖然已忘記那天，成年後仍害怕布偶裝。"}, {"id": "phobia-08", "no": 8, "zh": "注射恐懼症", "jp": "注射に対する恐怖心", "en": "Trypanophobia", "cat": "存在", "desc": "對注射或抽血產生恐懼，可能伴隨心悸、出汗或昏厥。", "ex": "自己抽血的錄影", "story": "拍攝者原想用抽血影片惡作劇，重新觀看後卻發現自己也害怕注射。"}, {"id": "phobia-09", "no": 9, "zh": "巨大物體恐懼症", "jp": "巨大物に対する恐怖心", "en": "Megalophobia", "cat": "存在", "desc": "對巨大建築、雕像、洞穴或廣闊空間感到恐懼，尤其當有熟悉尺寸作對比。", "ex": "米黃色洞穴", "story": "網絡流傳的「米黃色洞穴」恐怖圖片，據展覽所述實際拍攝的是胡佛水壩。"}, {"id": "phobia-10", "no": 10, "zh": "人偶恐懼症", "jp": "人形に対する恐怖心", "en": "Pediophobia", "cat": "存在", "desc": "對人偶產生強烈恐懼，可能涉及恐怖谷效應。", "ex": "大量人偶的影片", "story": "男子中學時在廢墟見到大量沒有頭部的人偶，此後害怕各種人偶的臉。"}, {"id": "phobia-11", "no": 11, "zh": "微小昆蟲恐懼症", "jp": "微細昆虫に対する恐怖心", "en": "Acarophobia", "cat": "存在", "desc": "害怕蟎蟲等微小生物，有時伴隨皮膚下有蟲爬行的妄想與蟲爬感。", "ex": "使用過的剃刀", "story": "女子因深信皮下有蟲而傷害皮膚，並保存使用過的刀片以求安心。"}, {"id": "phobia-12", "no": 12, "zh": "水恐懼症", "jp": "水に対する恐怖心", "en": "Hydrophobia", "cat": "存在", "desc": "對洗澡、積水及杯中的水等各種水產生恐懼，而非只害怕溺水。", "ex": "持續滴入水的玻璃杯", "story": "一件讓容器逐漸溢水的藝術品，令部分觀眾感到難以忍受的不安。"}, {"id": "phobia-13", "no": 13, "zh": "嘔吐恐懼症", "jp": "嘔吐に対する恐怖心", "en": "Emetophobia", "cat": "存在", "desc": "害怕嘔吐、在別人面前嘔吐，以及其他人可能嘔吐的狀態。", "ex": "姐姐的錄影現場", "story": "妹妹發現姐姐在鏡頭前大量進食，房內放着水桶，因而受到衝擊。"}, {"id": "phobia-14", "no": 14, "zh": "錯失恐懼", "jp": "取り残されることに対する恐怖心", "en": "Fear of Missing Out (FOMO)", "cat": "社會", "desc": "擔心自己是唯一被社會話題與活動拋下的人。", "ex": "社交媒體熱門趨勢", "story": "男性每天記錄所有熱門字詞，在睡前查清楚不認識的流行語。"}, {"id": "phobia-15", "no": 15, "zh": "外貌畸形恐懼症", "jp": "醜形に対する恐怖心", "en": "Dysmorphophobia", "cat": "社會", "desc": "對自身外貌缺點產生過度而痛苦的擔憂，即使缺點微不足道。", "ex": "使用修圖程式的照片", "story": "女性因親友批評外貌而開始極端修圖，即使知道別人嘲笑，也認為自己無法停止。"}, {"id": "phobia-16", "no": 16, "zh": "衰老恐懼症", "jp": "老化に対する恐怖心", "en": "Gerascophobia", "cat": "社會", "desc": "害怕外貌、體能及思想情感的老化。", "ex": "抗衰老藥物與補充劑", "story": "29 歲男性逐漸花大量金錢購買缺乏科學根據的「回春」產品。"}, {"id": "phobia-17", "no": 17, "zh": "視線恐懼症", "jp": "視線に対する恐怖心", "en": "Scopophobia", "cat": "社會", "desc": "對他人的注視或注意產生強烈緊張與恐懼。", "ex": "視線", "story": "網絡流傳的所有人看着鏡頭的圖片，被追溯至以導演經歷為基礎的學生電影。"}, {"id": "phobia-18", "no": 18, "zh": "笑聲恐懼症", "jp": "笑い声に対する恐怖心", "en": "Geliophobia", "cat": "社會", "desc": "害怕受到嘲笑，甚至對笑聲本身感到焦慮。", "ex": "攻擊性笑聲研究訪談錄音", "story": "受訪者不斷想像陌生人正在看着自己並嘲笑自己。"}, {"id": "phobia-19", "no": 19, "zh": "婚姻恐懼症", "jp": "結婚に対する恐怖心", "en": "Gamophobia", "cat": "社會", "desc": "對婚姻、長期承諾及婚後的人際變化感到恐懼。", "ex": "地方報紙讀者投稿欄", "story": "一位署名 R.M. 的常客反覆投稿婚姻與家庭的苦惱，甚至成為網絡討論對象。"}, {"id": "phobia-20", "no": 20, "zh": "噪音恐懼症", "jp": "騒音に対する恐怖心", "en": "Acousticophobia", "cat": "社會", "desc": "可能害怕別人的噪音，也可能害怕自己發出的聲音騷擾別人。", "ex": "噪音警告告示", "story": "住戶看到大廈噪音告示後，連疊放自己洗過的碟子的聲音都感到恐懼。"}, {"id": "phobia-21", "no": 21, "zh": "體臭恐懼症", "jp": "臭気に対する恐怖心", "en": "Autodysomophobia", "cat": "社會", "desc": "過度害怕自己或他人散發的氣味。", "ex": "買了之後很值得的四件東西", "story": "網誌作者詳細記錄長時間洗澡、測量口氣與各種除臭手段。"}, {"id": "phobia-22", "no": 22, "zh": "遺忘恐懼症", "jp": "忘却に対する恐怖心", "en": "Athazagoraphobia", "cat": "社會", "desc": "害怕被人遺忘，或自己失去記憶。", "ex": "極度詳細的日記簿", "story": "曾照顧母親多年的男性每天記錄精確到分鐘的生活細節。"}, {"id": "phobia-23", "no": 23, "zh": "恐音症", "jp": "様々な音に対する恐怖心", "en": "Misophonia", "cat": "社會", "desc": "對特定聲音如咀嚼聲、按筆聲或時鐘滴答聲產生強烈厭惡。", "ex": "令自己害怕的聲音", "story": "一些網友在閱讀別人的恐音經歷後，開始害怕原本未曾留意的聲音。"}, {"id": "phobia-24", "no": 24, "zh": "毛髮恐懼症", "jp": "毛髪に対する恐怖心", "en": "Trichopathophobia", "cat": "社會", "desc": "害怕頭髮或其他毛髮，尤其是散落的毛髮。", "ex": "毛髮恐懼的重現影片", "story": "因片段使多名工作人員不適而封存，副導演至今仍不敢清理浴室排水口。"}, {"id": "phobia-25", "no": 25, "zh": "電話恐懼症", "jp": "電話に対する恐怖心", "en": "Telephonophobia", "cat": "社會", "desc": "害怕打電話、接電話、鈴聲或手機震動。", "ex": "事務所的電話", "story": "長期處理投訴的新員工，後來甚至會聽見未曾響起的電話鈴聲。"}, {"id": "phobia-26", "no": 26, "zh": "對人恐懼症", "jp": "対人場面に対する恐怖心", "en": "Taijin kyofusho", "cat": "社會", "desc": "對在人前遭受負面評價或與他人互動感到恐懼。", "ex": "集合住宅的信箱", "story": "租客留下大量訊息及家當後失聯，房東聲稱從未見過他的面。"}, {"id": "phobia-27", "no": 27, "zh": "懼高症", "jp": "高所に対する恐怖心", "en": "Acrophobia", "cat": "空間", "desc": "在自認很高的地方害怕掉落，即使環境本身安全。", "ex": "引發懼高的住宅大廈", "story": "男子因樓梯扶手的空隙感到恐懼，後來搬到低層住所。"}, {"id": "phobia-28", "no": 28, "zh": "幽閉恐懼症", "jp": "閉所に対する恐怖心", "en": "Claustrophobia", "cat": "空間", "desc": "在狹小或封閉的空間中，因覺得無法逃走而恐慌。", "ex": "活埋挑戰.mp4", "story": "一段大學生把朋友關進自製棺材的惡作劇影片，記錄了對方逐漸失控。"}, {"id": "phobia-29", "no": 29, "zh": "污垢恐懼症", "jp": "汚れに対する恐怖心", "en": "Automysophobia", "cat": "空間", "desc": "對自己認為骯髒的物件及微量污垢感到恐懼。", "ex": "民居的榻榻米", "story": "大學生看到潮濕發黑的榻榻米後，開始害怕住所中的細小污漬。"}, {"id": "phobia-30", "no": 30, "zh": "海洋恐懼症", "jp": "海洋に対する恐怖心", "en": "Thalassophobia", "cat": "空間", "desc": "對大海、湖泊及廣闊水面感到極度恐懼。", "ex": "潛水期間的影片", "story": "熟悉海域的潛水者突然陷入恐慌，最終被他校學生救起。"}, {"id": "phobia-31", "no": 31, "zh": "醫院恐懼症", "jp": "病院に対する恐怖心", "en": "Nosocomephobia", "cat": "空間", "desc": "對整體醫院環境或能令人聯想到醫院的東西感到恐懼。", "ex": "帶有醫院氣味的脫脂棉", "story": "在家兼診所的環境長大的女性，成年後仍會因醫院氣味而乾嘔。"}, {"id": "phobia-32", "no": 32, "zh": "夢核恐懼", "jp": "ドリームコアに対する恐怖心", "en": "Paraoneirophobia", "cat": "空間", "desc": "對帶有懷舊感、模糊畫質與夢境氣氛的 Dreamcore 影像感到不安。", "ex": "夢核圖片的例子", "story": "論文作者主張，對夢核景象的恐懼應與一般夢境恐懼分開看待。"}, {"id": "phobia-33", "no": 33, "zh": "鏡子恐懼症", "jp": "鏡に対する恐怖心", "en": "Catoptrophobia", "cat": "空間", "desc": "對鏡子、鏡面反射或鏡中自己的形象感到恐懼。", "ex": "魔鏡啊魔鏡", "story": "不明來源的 VHS 影片拍攝了屋內每一面被報紙與紙皮封住的鏡子。"}, {"id": "phobia-34", "no": 34, "zh": "幸福恐懼症", "jp": "幸せに対する恐怖心", "en": "Cherophobia", "cat": "概念", "desc": "在感受或表達幸福時產生焦慮、內疚與恐懼，甚至擔心幸福會傷害別人。", "ex": "最後一篇投稿", "story": "以不幸經歷聞名的網紅，被揭發所說的遭遇均為虛構後停止活動。"}, {"id": "phobia-35", "no": 35, "zh": "夢境恐懼症", "jp": "夢に対する恐怖心", "en": "Oneirophobia", "cat": "概念", "desc": "害怕夢境、做夢本身，甚至連睡覺也開始迴避。", "ex": "夢境日記", "story": "一名男學生持續記錄夢境多年，但惡夢與清醒夢頻率增加後，逐漸害怕入睡，最終停止記錄。"}, {"id": "phobia-36", "no": 36, "zh": "幽靈恐懼症", "jp": "幽霊に対する恐怖心", "en": "Phasmophobia", "cat": "概念", "desc": "對幽靈、超自然現象及暗示其存在的影像產生強烈恐懼。", "ex": "姊妹的家庭錄影帶", "story": "兩姊妹在幼年錄影中突然朝房間同一方向哭喊「不要過來」。她們已不記得當時發生的事，成年後仍難以接觸恐怖題材。"}, {"id": "phobia-37", "no": 37, "zh": "死亡恐懼症", "jp": "死に対する恐怖心", "en": "Thanatophobia", "cat": "概念", "desc": "害怕死亡、死後意識永久消失，以及所有令人想起死亡的事物。", "ex": "死亡恐懼網誌", "story": "一名家庭主婦記錄自己想到「永遠消失」時心臟緊縮、呼吸困難的感受。"}, {"id": "phobia-38", "no": 38, "zh": "懷舊／鄉愁恐懼症", "jp": "ノスタルジー(郷愁)に対する恐怖心", "en": "Nostophobia", "cat": "概念", "desc": "害怕童年回憶、舊景物以及過去被現實改寫的可能。", "ex": "被拆卸的遊樂設施", "story": "退休男子重返家鄉，看到童年遊具已變得骯髒陌生，開始害怕其他美好回憶也被改寫。"}, {"id": "phobia-39", "no": 39, "zh": "丟棄物品恐懼症", "jp": "廃棄に対する恐怖心", "en": "Disposophobia", "cat": "概念", "desc": "害怕丟棄物品或失去與物品相連的回憶，因此累積大量物品。", "ex": "垃圾堆", "story": "女大學生按照使用頻率保留一切，包括吃完的便當盒；她認為那些只是排序靠後的用品，而非垃圾。"}, {"id": "phobia-40", "no": 40, "zh": "無限恐懼症", "jp": "無限に対する恐怖心", "en": "Apeirophobia", "cat": "概念", "desc": "對永恆、無限，或近乎永無盡頭的時間感到恐懼。", "ex": "關於地獄的故事", "story": "佛教幼稚園播放講述無間地獄極長刑期的教育錄影帶，據舊生回憶評價非常差。"}, {"id": "phobia-41", "no": 41, "zh": "時間恐懼症", "jp": "時間に対する恐怖心", "en": "Chronophobia", "cat": "概念", "desc": "對時間流逝、未來及時間的存在本身感到持續恐懼。", "ex": "報時", "story": "一名女子因害怕時間不知不覺流逝，開始用大音量不斷播放報時錄音。"}, {"id": "phobia-42", "no": 42, "zh": "罪惡恐懼症", "jp": "罪悪に対する恐怖心", "en": "Hamartophobia", "cat": "概念", "desc": "極度害怕自己的行為在無意間傷害別人，即使沒有客觀過錯也難以安心。", "ex": "致各位", "story": "一名女子以 24 小時固定鏡頭直播自己的生活，請觀眾確認她沒有做任何會傷害別人的事。說明文字描述從小時候紙張割傷同學開始，她如何畏懼自己成為「加害者」，甚至害怕自己的恐懼會觸發他人的恐懼。"}, {"id": "phobia-43", "no": 43, "zh": "恐懼本身恐懼症", "jp": "恐怖心に対する恐怖心", "en": "Phobophobia", "cat": "概念", "desc": "害怕自己產生恐懼，或讓別人感到恐懼；是對恐懼這種內在心理活動的後設認知性焦慮。", "ex": "無標題", "story": "毫無防備地接觸某種恐懼，有時反而會令人開始害怕「恐懼心」這種內心活動本身。"}];const CATS={"存在": "存在に対する恐怖心", "社會": "社会に対する恐怖心", "空間": "空間に対する恐怖心", "概念": "概念に対する恐怖心"};const nav=document.getElementById('nav'),sect=document.getElementById('sections'),filters=document.getElementById('filters'),side=document.getElementById('side');let active='全部';const clean=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function build(){let out='',nn='';Object.keys(CATS).forEach(cat=>{const xs=ITEMS.filter(x=>x.cat===cat);out+=`<div class="chapter" id="category-${cat}">${cat}｜${CATS[cat]}</div>`;nn+=`<div class="navgroup">${cat} — ${CATS[cat]}</div>`;xs.forEach(x=>{out+=`<article class="entry" id="${x.id}" data-cat="${x.cat}" data-text="${clean([x.zh,x.jp,x.en,x.desc,x.ex,x.story].join(' ').toLowerCase())}"><div class="num">作品 ${String(x.no).padStart(2,'0')}</div><h2>${clean(x.zh)}</h2><div class="jp">${clean(x.jp)}</div><div class="en">${clean(x.en)}</div><p>${clean(x.desc)}</p><h3>展品：${clean(x.ex)}</h3><p>${clean(x.story)}</p><a href="https://kyoufushin.com/caption-5c2c9901cdff/works/${x.no}/" target="_blank" rel="noopener noreferrer">日文原文 ↗</a>　<button class="copy" data-url="${x.id}">複製本節連結</button> <a class="back" href="#top">↑ 返回目錄</a></article>`;nn+=`<a class="navitem" href="#${x.id}" data-cat="${cat}" data-text="${clean([x.zh,x.jp,x.en].join(' ').toLowerCase())}">${String(x.no).padStart(2,'0')}　${clean(x.zh)}</a>`;});});sect.innerHTML=out;nav.innerHTML=nn;filters.innerHTML=['全部',...Object.keys(CATS)].map(c=>`<button data-cat="${c}" class="${c==='全部'?'active':''}">${c}</button>`).join('');}function update(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.entry').forEach(e=>{e.classList.toggle('hidden',(active!=='全部'&&e.dataset.cat!==active)||!e.dataset.text.includes(q))});document.querySelectorAll('.navitem').forEach(e=>{e.classList.toggle('hidden',(active!=='全部'&&e.dataset.cat!==active)||!e.dataset.text.includes(q))});document.querySelectorAll('.chapter').forEach(e=>{let entries=[...e.nextElementSibling.parentElement.querySelectorAll('.entry')];const cat=e.id.replace('category-','');e.classList.toggle('hidden',![...document.querySelectorAll('.entry')].some(v=>v.dataset.cat===cat&&!v.classList.contains('hidden')))});document.querySelectorAll('.navgroup').forEach(e=>{let next=e.nextElementSibling,has=false;while(next&&!next.classList.contains('navgroup')){if(!next.classList.contains('hidden'))has=true;next=next.nextElementSibling}e.classList.toggle('hidden',!has)});}build();document.getElementById('search').addEventListener('input',update);filters.addEventListener('click',e=>{if(e.target.dataset.cat){active=e.target.dataset.cat;filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.cat===active));update()}});document.getElementById('menu').onclick=()=>side.classList.toggle('open');nav.addEventListener('click',()=>side.classList.remove('open'));document.addEventListener('click',e=>{if(e.target.classList.contains('copy')){const url=location.href.split('#')[0]+'#'+e.target.dataset.url;navigator.clipboard?.writeText(url).then(()=>{e.target.textContent='已複製';setTimeout(()=>e.target.textContent='複製本節連結',1200)}).catch(()=>prompt('複製以下連結：',url));}});window.addEventListener('hashchange',()=>{const a=document.querySelector(location.hash);if(a&&a.classList.contains('hidden')){active='全部';document.getElementById('search').value='';filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.cat==='全部'));update()}});</script></body></html>
