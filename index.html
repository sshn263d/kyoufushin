</style></head><body><div class="mobilebar"><b>恐怖心展・43 項主題</b><button id="menu" aria-label="開啟目錄">☰ 目錄</button></div><div class="layout"><aside class="side" id="side"><div class="brand">恐怖心展</div><div class="sub">繁體中文・完整作品解說</div><input id="search" placeholder="搜尋中文 / 日本語 / Phobia…" aria-label="搜尋恐懼症"><div class="filters" id="filters"></div><nav id="nav"></nav></aside><main class="main" id="top"><div class="lead"><div class="sub">KYOUFUSHIN EXHIBITION • 43 SUBJECTS</div><h1>恐怖心展</h1><p>43 項恐懼主題與展品解說的完整繁體中文翻譯，保留日文原名及英文名稱。可搜尋名稱及全文、依類別篩選，或從目錄直接跳到指定作品。</p><div class="tools"><span class="pill">可直接離線閱讀</span><span class="pill">43 個固定錨點</span><span class="pill">手機版目錄</span></div><div class="notice">本頁包含全部 43 個主題的完整說明、展品故事及第 42 項直播說明全文。展覽中的案例、研究及聲稱按原文翻譯，不代表已獨立核實或獲醫學認證。</div></div><div id="sections"></div><footer>來源：<a href="https://kyoufushin.com/caption-5c2c9901cdff/" target="_blank" rel="noopener noreferrer">恐怖心展官方作品解說</a>。本頁為非官方繁體中文導覽。</footer></main></div><a href="#top" class="toplink" aria-label="回到頁首">↑</a><script>const ITEMS=[{"id":"phobia-01","no":1,"zh":"先端恐懼症","jp":"先端に対する恐怖心","en":"Aichmophobia","cat":"存在","desc":"害怕剪刀、鉛筆、牙籤等尖銳物體；即使桌上的筆朝向自己，也可能引發恐懼。","ex":"各種物體的尖端","story":"個別人士對不同尖端的恐懼程度並不相同。","fullDesc":["剪刀、鉛筆、牙籤等尖銳物體，都可能成為恐懼的對象。","即使只是「桌上的原子筆指向自己」或「電視劇人物正用手指指向鏡頭」，也可能引發這種恐懼。","無論物件實際上有沒有危險，都可能導致強烈恐懼反應，影響日常生活及社交活動。"],"fullExTitle":"各種物體的尖端","fullStory":["這些是自稱害怕「尖端」的人列舉為恐懼對象的各種物件。","［引用並重新整理自：岩田，2014，《系統性減敏法的抑制效果：關於尖端恐懼抑制的評估》。］","該研究的調查發現，並非所有人都同樣害怕這裏列出的尖端；每個人會出現不同的恐懼程度，例如「這個尖端沒問題，但那個尖端很可怕」。"]},{"id":"phobia-02","no":2,"zh":"密集物體恐懼症","jp":"集合体に対する恐怖心","en":"Trypophobia","cat":"存在","desc":"害怕蜂巢、蓮蓬或電路板等密集排列的孔洞與形狀。","ex":"引發密集恐懼的圖片","story":"三名人士均因偶然看到社交媒體圖片而意識到自己的恐懼，當中包括普通雨滴照片。","fullDesc":["對各種東西集合或密集排列的狀態產生的恐懼。範圍很廣，從蜂巢、蓮蓬等自然物，到電腦電路板等人工製品均包括在內。","這種恐懼所引發的症狀，雖未獲正式認定為獨立診斷名稱，但在互聯網及社交媒體上經常有人報告。"],"fullExTitle":"令人首次害怕密集物體的圖片","fullStory":["這些圖片重現三名人士首次意識到自己害怕「密集物體」時看到的影像。","［引用並重新整理自：越野，2022，《關於誘發密集物體恐懼圖像之厭惡閾值的建議》。］","從左至右，分別是一名當時21歲的男大學生、16歲的女高中生，以及33歲、在製造業公司工作的女性首次意識到恐懼的圖片重現。","三人都證實，契機是「在社交媒體上無意間看見的圖片」。其中雨滴的照片根本不是為了令人害怕密集物體而拍攝；據說只是一名朋友在雨天隨手上傳的照片。"]},{"id":"phobia-03","no":3,"zh":"牙科恐懼症","jp":"歯科に対する恐怖心","en":"Dentophobia","cat":"存在","desc":"對牙科治療、牙科器械或牙齒本身感到恐懼。","ex":"被帶回家的牙齒","story":"男性把拔下來的恆齒帶回家留念，卻令原本就害怕牙醫的妹妹產生強烈抗拒。","fullDesc":["對牙科治療，或者牙齒本身的恐懼。","對於前者，患者可能對牙科器械、局部麻醉等有嚴重的預期性焦慮；對於後者，令人不舒服的並不是「聯想到牙齒的東西」，而是「牙齒」本身。"],"fullExTitle":"被帶回家的牙齒","fullStory":["這是一名在東京都內大學就讀的男性，接受涉及拔牙的治療後帶回家的恆齒。","治療後，他把拔出的恆齒當作「紀念品」帶回家。然而，他那名本來就「不喜歡牙醫」的妹妹，據哥哥說，看到後出現了強烈得令他心想「有必要反應成這樣嗎？」的抗拒反應。"]},{"id":"phobia-04","no":4,"zh":"氣球恐懼症","jp":"風船に対する恐怖心","en":"Globophobia","cat":"存在","desc":"通常源於對氣球爆破的預期性焦慮，甚至可能害怕氣球氣味或造型。","ex":"巨大氣球","story":"某電視整人節目使用巨大氣球，使藝人驚慌到片段不適合播出。","fullDesc":["對充了氣的氣球產生強烈恐懼。通常是預期「氣球可能爆破」所引發的焦慮。","具有這種恐懼的人，傾向拒絕觸摸氣球、接近氣球、聞到氣球特有的橡膠味，甚至不願觀賞氣球造型藝術。"],"fullExTitle":"巨大氣球","fullStory":["這是電視節目、音樂演唱會等會使用的巨大氣球。","十多年前，東京電視台某綜藝節目在整人企劃中使用了與本展品完全同款、同色的氣球。結果，一名害怕氣球爆破的藝人嚴重驚慌失措。","據當時製作人說，其反應實在太「不適合電視播映」，因此片段最後被封存，沒有播出。"]},{"id":"phobia-05","no":5,"zh":"蜘蛛恐懼症","jp":"蜘蛛に対する恐怖心","en":"Arachnophobia","cat":"存在","desc":"即使是圖片或卡通化的蜘蛛，也可能帶來強烈焦慮。","ex":"暗示蜘蛛存在的圖片","story":"一名男子看到時鐘後方露出長蜘蛛腳的網絡圖片後，開始極度害怕蜘蛛。","fullDesc":["對所有蜘蛛產生極端且不合理的恐懼，包括照片或簡化、卡通化的畫像。","即使幾乎沒有實際危險，單單察覺到蜘蛛存在，也可能引發強烈焦慮甚至恐慌。"],"fullExTitle":"暗示蜘蛛存在的圖片","fullStory":["這幅重現圖片，是一名在東京都內經營服裝店的男子開始自覺害怕蜘蛛的契機。","他偶然在網上看到一幅「指針式時鐘背後露出長長蜘蛛腳」的圖片，此後便對蜘蛛表現出強烈抗拒。","該圖片經常在匿名討論區被轉載，是所謂「精神ブラクラ」——令人心理不適的驚嚇圖片——之一。","目前，這名男子因為認為「不會有蜘蛛出沒」，而居於市中心住宅大廈的高層。"]},{"id":"phobia-06","no":6,"zh":"微生物恐懼症","jp":"微生物に対する恐怖心","en":"Bacillophobia","cat":"存在","desc":"對細菌、微生物及可能滋生它們的環境感到恐懼。","ex":"小學保健通訊","story":"女性兒時看到手上細菌的圖片受驚，此後養成頻繁消毒的習慣。","fullDesc":["對細菌、微生物，或可能滋生它們的物體產生恐懼。","這類恐懼有時伴隨生活中的各種迴避行為，例如反覆洗手和洗澡、一天換衣服好幾次。"],"fullExTitle":"小學保健通訊","fullStory":["這是某小學保健室門外曾張貼一段時間的真實告示，以及告示中「手上繁殖的細菌」的重現。","一名當時在該校就讀的女性，看見那張被描述為「沒有洗手的手上繁殖的細菌」的照片後大受打擊，開始非常害怕微生物和細菌。","現在她出門必帶業務用消毒濕紙巾，每次接觸門把、升降機按鈕等東西都習慣為雙手消毒。"]},{"id":"phobia-07","no":7,"zh":"布偶裝恐懼症","jp":"着ぐるみに対する恐怖心","en":"Maskaphobia","cat":"存在","desc":"對真人大小的吉祥物、面具及布偶裝角色產生不合理的強烈恐懼。","ex":"與布偶裝角色拍攝的合照","story":"女子幼年與吉祥物合照後痛哭；雖然已忘記那天，成年後仍害怕布偶裝。","fullDesc":["對布偶裝產生超越合理依據的強烈恐懼。「Maskaphobia」的對象亦包括面具、變裝服飾及吉祥物。","與人偶恐懼不同的是，這種恐懼來自「具有真人大小」及「穿着現實中原本不可能存在的裝束」等特徵。"],"fullExTitle":"與布偶裝角色拍攝的合照","fullStory":["這是一名現職小學教師的女性，在童年時與布偶裝角色拍攝的照片。","當時她在家鄉一間小型遊樂園，因同行母親建議而拍照。母親說，照片拍完後，年幼的她就像着了火一樣嚎啕大哭。","雖然她對當年已毫無印象，至今仍會對兒童向吉祥物布偶裝及真人大小的人偶感到深不可測的恐懼。"]},{"id":"phobia-08","no":8,"zh":"注射恐懼症","jp":"注射に対する恐怖心","en":"Trypanophobia","cat":"存在","desc":"對注射或抽血產生恐懼，可能伴隨心悸、出汗或昏厥。","ex":"自己抽血的錄影","story":"拍攝者原想用抽血影片惡作劇，重新觀看後卻發現自己也害怕注射。","fullDesc":["對醫療注射、抽血等程序產生恐懼。有一種說法指，全人口約10%對注射抱有達到症狀程度的特定恐懼。","可能引發心悸、出汗，甚至昏厥；很多人也會迴避電視劇、電影中的注射場景。這種恐懼與對血液及尖端的恐懼關係密切。"],"fullExTitle":"拍攝自己抽血的影片","fullStory":["這是一段在某間醫院拍攝的抽血過程。","拍攝者在健康檢查時本想拍下抽血影片，惡作劇嚇唬一名「討厭打針」的朋友。","但他在手機相簿重看時，竟發現自己也對注射感到強烈恐懼，最後沒有將影片傳給朋友。"]},{"id":"phobia-09","no":9,"zh":"巨大物體恐懼症","jp":"巨大物に対する恐怖心","en":"Megalophobia","cat":"存在","desc":"對巨大建築、雕像、洞穴或廣闊空間感到恐懼，尤其當有熟悉尺寸作對比。","ex":"米黃色洞穴","story":"網絡流傳的「米黃色洞穴」恐怖圖片，據展覽所述實際拍攝的是胡佛水壩。","fullDesc":["對巨大構造物或廣闊空間產生過度、持續的焦慮與恐懼。","摩天大樓、大型雕塑、巨大洞穴等，只要帶來壓倒性的存在感都可能是對象。","若旁邊有日常熟悉的比較對象，例如「住宅區內的巨大佛像」或「人在鐘乳洞中細小得像豆粒」，不安便更容易增強。"],"fullExTitle":"「米黃色洞穴」","fullStory":["這是2009年在日本2channel「【水壩洞】貼出巨大得恐怖的圖片 Part2【大佛】」討論串分享、曾在小範圍成為迷因的圖片之高解像度版。","此後它成為該討論區經典的恐怖圖片「範本」，獲得「米黃色洞穴」的別名。","不過，據說這張當時被當成「洞穴」傳播的照片，實際上拍攝的是美國科羅拉多河上的「胡佛水壩」。"]},{"id":"phobia-10","no":10,"zh":"人偶恐懼症","jp":"人形に対する恐怖心","en":"Pediophobia","cat":"存在","desc":"對人偶產生強烈恐懼，可能涉及恐怖谷效應。","ex":"大量人偶的影片","story":"男子中學時在廢墟見到大量沒有頭部的人偶，此後害怕各種人偶的臉。","fullDesc":["對人偶產生超出合理依據的強烈恐懼。除童年經驗、文化背景外，也被認為涉及「恐怖谷效應」等認知機制。","※恐怖谷效應：極度接近人類、但又不完全像人的物體，會令人感到違和或焦慮的現象。"],"fullExTitle":"大量人偶的影片","fullStory":["這是某名男子在中學時期拍攝、令他開始害怕人偶的影像。","他們抱着玩樂心態潛入一座廢墟，看到大量人偶後，開始迴避所有把某種生物卡通化的物件。","拍攝者回憶說：「那些人偶不是沒有（頸部以上）嗎？所以反而所有人偶的臉都令我無法接受。我會忍不住想像，可愛的卡通人偶如果臉掉下來，露出『裏面』會是怎樣。」","無論外形或有沒有缺損，這種對所有「人偶」的排斥、恐懼，在十多年後仍然持續。"]},{"id":"phobia-11","no":11,"zh":"微小昆蟲恐懼症","jp":"微細昆虫に対する恐怖心","en":"Acarophobia","cat":"存在","desc":"害怕蟎蟲等微小生物，有時伴隨皮膚下有蟲爬行的妄想與蟲爬感。","ex":"使用過的剃刀","story":"女子因深信皮下有蟲而傷害皮膚，並保存使用過的刀片以求安心。","fullDesc":["對蟎蟲等細小生物產生恐懼。有時伴隨「小蟲鑽進皮膚底下」的妄想，以及難以忍受的痕癢與蟲爬感。"],"fullExTitle":"使用過的剃刀","fullStory":["這些是在某名女性家中找到的使用過的剃刀。","她為療養而搬往東京都██████中心時，一名協助收拾的朋友發現了它們。","她長期受抗精神病藥物副作用或停藥症狀導致的靜坐不能症（Akathisia）困擾，後來逐漸陷入「有小蟲在自己皮膚底下爬行」的妄想。","為了取出「蟲」，她日常用剃刀刀片挖割自己大腿及手臂，並保留用過的刀片，說是為了「想起自己已取出蟲子而安心」。"]},{"id":"phobia-12","no":12,"zh":"水恐懼症","jp":"水に対する恐怖心","en":"Hydrophobia","cat":"存在","desc":"對洗澡、積水及杯中的水等各種水產生恐懼，而非只害怕溺水。","ex":"持續滴入水的玻璃杯","story":"一件讓容器逐漸溢水的藝術品，令部分觀眾感到難以忍受的不安。","fullDesc":["對任何形式的水產生恐懼，包括洗澡、積水、杯中的水。","不只是看不見水底時擔心「可能溺水」；即使是「杯裏有水一直放着」這種乍看毫無危險的情況，也可能引發恐懼。"],"fullExTitle":"不斷被注入水的玻璃杯","fullStory":["這是曾於███藝術大學畢業展公開、在部分社交媒體引起「看着就很不安」話題的作品複製品。","物件的設計是讓天花板上的水慢慢滴下，經過幾個小時從容器溢出。","有人發文稱「起雞皮疙瘩，連幾秒也看不下去」、「這麼可怕的東西不是藝術」，令作品小範圍爆紅。","當年創作的學生表示，刻意引起某種特定恐懼並不是主要目的。"]},{"id":"phobia-13","no":13,"zh":"嘔吐恐懼症","jp":"嘔吐に対する恐怖心","en":"Emetophobia","cat":"存在","desc":"害怕嘔吐、在別人面前嘔吐，以及其他人可能嘔吐的狀態。","ex":"姐姐的錄影現場","story":"妹妹發現姐姐在鏡頭前大量進食，房內放着水桶，因而受到衝擊。","fullDesc":["對嘔吐產生極度的恐懼或厭惡。除嘔吐本身，想像「在別人面前嘔吐」、看到「別人感到噁心」，乃至任何「可能嘔吐」的情況，都可能引發嚴重的預期性焦慮。"],"fullExTitle":"姐姐的錄影現場","fullStory":["這段影片令一名住在家中、在專門學校就讀的女性，意識到自己害怕嘔吐。","她有一名年長數歲的姐姐，兩人都住在父母家。某晚妹妹聽到姐姐房間傳出奇怪聲音，便往裏面看。","姐姐在鏡頭前攤開大量垃圾食品與甜品，默默地把食物塞進胃裏。","房內放着許多水桶；看見姐姐一邊像在忍耐甚麼般深呼吸，一邊繼續咀嚼，妹妹受到不小衝擊。"]},{"id":"phobia-14","no":14,"zh":"錯失恐懼","jp":"取り残されることに対する恐怖心","en":"Fear of Missing Out (FOMO)","cat":"社會","desc":"擔心自己是唯一被社會話題與活動拋下的人。","ex":"社交媒體熱門趨勢","story":"男性每天記錄所有熱門字詞，在睡前查清楚不認識的流行語。","fullDesc":["害怕「會不會只有自己被社會拋在後面」的模糊焦慮。Fear of Missing Out 也簡稱 FOMO。","因為「別人都在討論自己不知道的話題」而感到被排斥，這種感覺在社交媒體發展後變得更明確可見。"],"fullExTitle":"社交媒體熱門趨勢","fullStory":["這是一名東京都內廣告代理公司職員每天儲存的社交媒體趨勢排行榜截圖。","他因為「害怕大家在討論自己不知道的事」，每天記錄所有平台的熱門搜尋詞和趨勢。睡前把所有不認識的詞語及網絡俚語逐一查清，已成了例行習慣。"]},{"id":"phobia-15","no":15,"zh":"外貌畸形恐懼症","jp":"醜形に対する恐怖心","en":"Dysmorphophobia","cat":"社會","desc":"對自身外貌缺點產生過度而痛苦的擔憂，即使缺點微不足道。","ex":"使用修圖程式的照片","story":"女性因親友批評外貌而開始極端修圖，即使知道別人嘲笑，也認為自己無法停止。","fullDesc":["即使外貌缺點在別人眼中根本不存在，或只是微不足道，當事人仍會產生強烈焦慮與痛苦。","其根源往往涉及社會壓力下對外貌的過度期待與批評，或童年、青春期的負面經歷。"],"fullExTitle":"經修圖程式處理的照片","fullStory":["這是一名現職公務員的女性，剛搬到東京入讀大學時，在社交媒體上發表的照片，由她本人提供。","她回憶：「我剛開始獨居時，父母和家鄉朋友說：『你怎麼一直都那麼土氣？至少學點化妝吧？』」","「他們多半真的沒有惡意吧。但對當時的我來說根本不重要。所以事情才變成那樣。」","「其實我當時隱約知道修圖效果會嚇到人。父母和舊朋友都覺得詭異。但我覺得不是修圖詭異，而是他們根本不懂美醜的笨蛋。到現在我也多少還這樣想。」","「我當然知道自己的臉和修圖在網上被嘲笑。貼在我照片上【※觀看注意】的字幕，我看過無數次。說到底，連我自己也從來沒覺得現在這張臉好看。可是事到如今怎麼可能停下來？這副外貌，早已不是好不好看的問題了。」"]},{"id":"phobia-16","no":16,"zh":"衰老恐懼症","jp":"老化に対する恐怖心","en":"Gerascophobia","cat":"社會","desc":"害怕外貌、體能及思想情感的老化。","ex":"抗衰老藥物與補充劑","story":"29 歲男性逐漸花大量金錢購買缺乏科學根據的「回春」產品。","fullDesc":["對正常老化現象的過度、持續恐懼。除身體衰退和外貌轉變，也會對感情及思想的「老化」感到極大不安。"],"fullExTitle":"抗衰老","fullStory":["這是一名在地方銀行工作的29歲男子，從不同網店及海外供應商訂購的「抗衰老」藥物和保健品。","朋友說，他在27歲左右開始害怕身心各方面的「老化」，經常反覆說「真想回到以前」、「如果我變成老害就殺了我」、「必須更加年輕才行」。","最初是便宜的維他命與健康飲品；後來頻率和開銷不斷增加，變成「回春腦波」、「細胞回春促進劑」等缺乏科學證據的產品。","他以「一定也有別人抱着相同煩惱」為理由，同意提供展品。"]},{"id":"phobia-17","no":17,"zh":"視線恐懼症","jp":"視線に対する恐怖心","en":"Scopophobia","cat":"社會","desc":"對他人的注視或注意產生強烈緊張與恐懼。","ex":"視線","story":"網絡流傳的所有人看着鏡頭的圖片，被追溯至以導演經歷為基礎的學生電影。","fullDesc":["對別人直接或間接注意自己，產生伴隨極度緊張的恐懼。相關行為常被稱作「怯場」，而在某些社群被嘲笑，又會進一步加重焦慮與創傷。"],"fullExTitle":"視線","fullStory":["網上有一張已成迷因的著名圖片：「所有人都在看着這邊」。","關於最初出處一直有各種爭論；後來2channel討論串「【獵首族辣妹】尋找那張圖片的最初出處 Part4【燕尾服縫紉機】」查出，是■■大學電影研究會自製電影《視線》的場景。","這部片據說根據導演親身經驗創作，描繪大學生主角如何受各種「視線」折磨。"]},{"id":"phobia-18","no":18,"zh":"笑聲恐懼症","jp":"笑い声に対する恐怖心","en":"Geliophobia","cat":"社會","desc":"害怕受到嘲笑，甚至對笑聲本身感到焦慮。","ex":"攻擊性笑聲研究訪談錄音","story":"受訪者不斷想像陌生人正在看着自己並嘲笑自己。","fullDesc":["對被他人嘲笑，以及笑聲本身產生強烈焦慮與恐懼。","當事人若把被笑與「羞恥」、「嘲弄」、「壞評價」密切聯繫，就可能使笑聲本身成為恐懼的觸發因素。"],"fullExTitle":"《第二節：攻擊性笑聲與主觀感受的關係——觀察紀錄與探討》採訪錄音②","fullStory":["這是███大學研究院心理學研究室編著《笑聲行為與精神心理學》收錄的訪談錄音，由當時的研究班學生自行採訪。","受訪者在日常生活中被「陌生人看着自己發笑」的想像折磨，生活因而受影響。","書中採訪學生記述，受訪者「連訪談途中也頻繁地不安地四處張望」。"]},{"id":"phobia-19","no":19,"zh":"婚姻恐懼症","jp":"結婚に対する恐怖心","en":"Gamophobia","cat":"社會","desc":"對婚姻、長期承諾及婚後的人際變化感到恐懼。","ex":"地方報紙讀者投稿欄","story":"一位署名 R.M. 的常客反覆投稿婚姻與家庭的苦惱，甚至成為網絡討論對象。","fullDesc":["對婚姻、婚姻前提下的長期交往與伴侶關係，以及婚後人際關係產生恐懼。","對伴侶間的「承諾」或人際關係本身的轉變，也可能出現極度抗拒。"],"fullExTitle":"報紙讀者投稿欄","fullStory":["這些是██縣地方報紙《█████新聞》讀者欄中，推測由同一人定期投稿的文章。","投稿者署名「R.M.」，經常寫到自己對「結婚」、「家庭」、「姻親關係」的觀念、恐懼及痛苦。","地方報紙本來積極投稿者不多，因此他被當成「常客」。因其鮮明文風，一小群匿名網友甚至開設專門討論串「RMヲチスレ」（RM觀察串），令他在部分網絡社群出名。"]},{"id":"phobia-20","no":20,"zh":"噪音恐懼症","jp":"騒音に対する恐怖心","en":"Acousticophobia","cat":"社會","desc":"可能害怕別人的噪音，也可能害怕自己發出的聲音騷擾別人。","ex":"噪音警告告示","story":"住戶看到大廈噪音告示後，連疊放自己洗過的碟子的聲音都感到恐懼。","fullDesc":["對令人不快的聲音或雜音產生恐懼；因會引起明顯壓力反應，與主要表現為對特定聲音厭惡或憤怒的恐音症（Misophonia）有所區別。","既可能害怕遭受「製造噪音者」傷害，也可能害怕「自己或許正在製造噪音」而傷害別人。"],"fullExTitle":"噪音警告告示","fullStory":["這是一張貼在某住宅大廈公告欄的噪音提醒。","當時與男友同居的女子說，男友自從看到告示就極度害怕噪音。","「他本來不是腳步或說話很吵的人，倒不如說很安靜。」","「但他看了告示後，可能擔心有人覺得他煩人。於是極度害怕發出聲音，連疊起自己洗過的碟子都會被聲音嚇到。」","「我想那張告示根本不是在警告他。」"]},{"id":"phobia-21","no":21,"zh":"體臭恐懼症","jp":"臭気に対する恐怖心","en":"Autodysomophobia","cat":"社會","desc":"過度害怕自己或他人散發的氣味。","ex":"買了之後很值得的四件東西","story":"網誌作者詳細記錄長時間洗澡、測量口氣與各種除臭手段。","fullDesc":["對氣味，尤其自己身上發出的氣味，抱有潛在恐懼。","即使社會上其實不構成問題，仍可能極度害怕或厭惡自己、他人的體味及特定惡臭。"],"fullExTitle":"「買了之後覺得很值得的四件東西」","fullStory":["這是一名個人網誌作者撰寫的文章。他平日經常在日記中談論「自己氣味」造成的不良影響，把所有除臭方法記錄為「備忘錄」或「最基本的體貼」。","由「早上起床後洗澡四十至五十分鐘」的日常習慣，到「推薦的口臭測量儀與個人海外訂購方法」等特殊資訊，網誌均有記載。"]},{"id":"phobia-22","no":22,"zh":"遺忘恐懼症","jp":"忘却に対する恐怖心","en":"Athazagoraphobia","cat":"社會","desc":"害怕被人遺忘，或自己失去記憶。","ex":"極度詳細的日記簿","story":"曾照顧母親多年的男性每天記錄精確到分鐘的生活細節。","fullDesc":["害怕被別人遺忘，或者自己失去某段記憶，並產生極端、不合理的焦慮與恐懼。","如果家人或熟人曾經有記憶方面的問題，相關經驗也可能放大不安。"],"fullExTitle":"極度詳細的日記簿","fullStory":["這是一名男子稱「大概已持續十年」的日記。","他每天記下「起床後左腳先踏下床」、「9時00分開始的早會在9時06分結束」等極細緻的生活紀錄。","男子從三十歲起照顧母親約八年，自那時開始莫名害怕「忘記日常記憶」或「幾天前的記憶變模糊」，於是每天毫不間斷地寫下詳細日記。"]},{"id":"phobia-23","no":23,"zh":"恐音症","jp":"様々な音に対する恐怖心","en":"Misophonia","cat":"社會","desc":"對特定聲音如咀嚼聲、按筆聲或時鐘滴答聲產生強烈厭惡。","ex":"令自己害怕的聲音","story":"一些網友在閱讀別人的恐音經歷後，開始害怕原本未曾留意的聲音。","fullDesc":["對特定聲音產生模糊的不安或厭惡；不同於一般「聽覺過敏」，它存在明確的觸發聲音。","典型例子包括按原子筆、咀嚼，以及指針式時鐘的聲音。"],"fullExTitle":"令人恐懼的聲音","fullStory":["這些是日本匿名討論區「發言小町」中「別人無法理解、但我害怕的聲音」討論串列出的恐懼、不快聲音的一部分；本展選出留言尤其多的兩種。","討論串收到各式留言，其中很多人說：「來這裏之前沒察覺，但聽別人一說，的確開始覺得可怕。」換言之，讀過討論後反而增加了害怕的東西。"]},{"id":"phobia-24","no":24,"zh":"毛髮恐懼症","jp":"毛髪に対する恐怖心","en":"Trichopathophobia","cat":"社會","desc":"害怕頭髮或其他毛髮，尤其是散落的毛髮。","ex":"毛髮恐懼的重現影片","story":"因片段使多名工作人員不適而封存，副導演至今仍不敢清理浴室排水口。","fullDesc":["對頭髮（有時包括仿毛皮和動物皮毛）產生恐懼。","連附在衣物、家具上的頭髮也可能引發不安，有人因此反覆清潔房間，避免留下任何毛髮；也有人把自己的頭髮束起，以免掉落。"],"fullExTitle":"重現毛髮恐懼的影片","fullStory":["這是以「介紹觀眾投稿的靈異與奇怪經驗」為主題的綜藝節目，原本要播出的重現短劇。","當時導演根據一名髮型師的投稿拍攝，但在檢查影片時多名工作人員嚴重不適，於是片段被封存，也取消在節目播出。","參與製作的副導演說：「直到現在，我仍不能親手清潔家中浴室和洗手盆的排水口。」"]},{"id":"phobia-25","no":25,"zh":"電話恐懼症","jp":"電話に対する恐怖心","en":"Telephonophobia","cat":"社會","desc":"害怕打電話、接電話、鈴聲或手機震動。","ex":"事務所的電話","story":"長期處理投訴的新員工，後來甚至會聽見未曾響起的電話鈴聲。","fullDesc":["在撥打或接聽電話時，產生遠超正常程度的強烈恐懼。","因此極端迴避電話，甚至對鈴聲或震動作出反射性的恐懼反應。"],"fullExTitle":"電話","fullStory":["這是一部曾放在某設計事務所辦公桌上的電話。","某段時期，新入職男員工按公司的傳統規定，獨自負責處理企業及私人客戶的所有投訴電話。","幾個月後，他對電話響起的聲音感到極度害怕，甚至開始聽到沒響起的「鈴聲」，影響工作。","離職前，他會接起根本沒響的電話，無言站着，之後才發現自己弄錯、放回話筒。據說幾乎所有同事都見過這個情況。"]},{"id":"phobia-26","no":26,"zh":"對人恐懼症","jp":"対人場面に対する恐怖心","en":"Taijin kyofusho","cat":"社會","desc":"對在人前遭受負面評價或與他人互動感到恐懼。","ex":"集合住宅的信箱","story":"租客留下大量訊息及家當後失聯，房東聲稱從未見過他的面。","fullDesc":["對在人前受到別人負面評價，進一步對人際互動本身產生焦慮及恐懼。","原文指出，需要治療程度的「對人恐懼症」在日本尤為常見，英語圈也直接使用「Taijin kyofusho」這個日語羅馬字名稱。"],"fullExTitle":"集合住宅的信箱","fullStory":["這是██區████某棟集合住宅的信箱，以及貼在上面的大量留言。","據業主所說，該單位曾住着獨居成年男性，但連入住當天在內，自己從來沒有見過他的臉。","某段時間後，他留下家具與物品，突然失去聯絡。其後大廈進行大規模翻新，這件無人認領的物品便被捐給展覽。"]},{"id":"phobia-27","no":27,"zh":"懼高症","jp":"高所に対する恐怖心","en":"Acrophobia","cat":"空間","desc":"在自認很高的地方害怕掉落，即使環境本身安全。","ex":"引發懼高的住宅大廈","story":"男子因樓梯扶手的空隙感到恐懼，後來搬到低層住所。","fullDesc":["對當事人認為「高」的任何地方產生恐懼。即使安全獲保證，也可能擔心「會不會掉下去」，因此避開高處。","每個人對「高處」的認定差異很大，所以同樣稱作懼高症，能承受的高度也不盡相同。"],"fullExTitle":"引發高處恐懼的住宅大廈","fullStory":["這是現居東京都內公寓的一名男性插畫師，曾住過的大廈，照片經同意拍攝。","他曾在九樓獨居數年，卻在突然意識到自己害怕高處後不久搬走，改住低層公寓一樓。","他說，某次升降機維修，必須行樓梯；無意間看見「樓梯扶手之間的空隙」，不知怎地覺得非常可怕，從此不靠牆走便無法安心。"]},{"id":"phobia-28","no":28,"zh":"幽閉恐懼症","jp":"閉所に対する恐怖心","en":"Claustrophobia","cat":"空間","desc":"在狹小或封閉的空間中，因覺得無法逃走而恐慌。","ex":"活埋挑戰.mp4","story":"一段大學生把朋友關進自製棺材的惡作劇影片，記錄了對方逐漸失控。","fullDesc":["對物理上密封的空間和狹小房間產生恐懼。","進入封閉空間時，「自己無法從這裏出去」的認知被不斷放大，可能演變成難以承受的恐慌。","升降機、飛機是典型場所，但試身室或人群等嚴格來說開放的空間也可能引發相同恐懼；這些情況有時歸為「廣場恐懼症」。","※這裏「廣場」並非公園的意思，而是較廣義的「空間」。"],"fullExTitle":"「活埋挑戰.mp4」","fullStory":["這是幾名大學生共同經營的YouTube頻道上傳、現已刪除的影片，標題為「【觀看注意】把猜拳輸掉的朋友活埋，結果太誇張了……【慘叫】」。","影片中，猜拳輸掉的人被關進自製棺材，其他成員進行「活埋」，記錄了被困者逐漸驚慌失措的過程。","現在該頻道實際上已停止活動。"]},{"id":"phobia-29","no":29,"zh":"污垢恐懼症","jp":"汚れに対する恐怖心","en":"Automysophobia","cat":"空間","desc":"對自己認為骯髒的物件及微量污垢感到恐懼。","ex":"民居的榻榻米","story":"大學生看到潮濕發黑的榻榻米後，開始害怕住所中的細小污漬。","fullDesc":["對當事人認為「污垢」的一切東西產生恐懼。","即使只是實際上不危害健康的污漬或細菌，也可能引發過度焦慮。與微生物恐懼相似，常伴隨反覆洗手等確認行為。"],"fullExTitle":"民居的榻榻米","fullStory":["這塊榻榻米令一名大學生首次意識到自己害怕「污垢」。","他升讀大學後找便宜住所，曾參觀一間樓齡較高的公寓。房間還沒有換榻榻米，潮濕發黑的草蓆仍然放着，其他家具也嚴重污損。","最後他選擇另一間公寓，但自從看過那屋裏的黑色榻榻米，就開始對自己住所的任何細小污漬感到不安。"]},{"id":"phobia-30","no":30,"zh":"海洋恐懼症","jp":"海洋に対する恐怖心","en":"Thalassophobia","cat":"空間","desc":"對大海、湖泊及廣闊水面感到極度恐懼。","ex":"潛水期間的影片","story":"熟悉海域的潛水者突然陷入恐慌，最終被他校學生救起。","fullDesc":["對海洋等廣闊水域產生極度恐懼。湖泊、河流等「廣闊水面」也可能成為對象。","不只到海邊玩或戶外活動，觀看以海為主題的遊戲或電影，也可能引起恐懼。"],"fullExTitle":"潛水期間的影片","fullStory":["這是██大學海洋研究會（參與潛水的社團）成員，在大學附近著名潛點以手持攝影機拍下的第一身影像。","拍攝者游了一段時間後突然恐慌，一邊急促吐氣，一邊在海中徘徊，最終無力地停止動作，連攝影機也掉落。","幸好他被其他大學學生救起，沒有生命危險。","他回憶：「那片海我明明潛過很多次，但不知道為甚麼，突然覺得此刻的情況非常可怕。」此後為安全起見，他不再參與社團旅行或遠征的潛水和浮潛。"]},{"id":"phobia-31","no":31,"zh":"醫院恐懼症","jp":"病院に対する恐怖心","en":"Nosocomephobia","cat":"空間","desc":"對整體醫院環境或能令人聯想到醫院的東西感到恐懼。","ex":"帶有醫院氣味的脫脂棉","story":"在家兼診所的環境長大的女性，成年後仍會因醫院氣味而乾嘔。","fullDesc":["對「醫院」整個醫療環境感到恐懼或焦慮。不同於特別害怕牙醫、注射等個別手段，而是對任何籠統令人聯想到醫院的事物產生恐懼。"],"fullExTitle":"帶有「醫院氣味」的脫脂棉","fullStory":["這是使用過的脫脂棉及保存它們的容器。","提供展品的女性，父親原本是醫療從業員，經營一間住所兼兒科的小診所。","她說：「原本就是鄉下小兒科，幾十年前很多事情都很隨便。用過、沾滿酒精和藥品味的脫脂棉，竟然作為家庭垃圾丟到飯桌旁的垃圾桶。是飯桌旁啊！那樣連喜歡的食物是甚麼味道都不知道了。」","「正因這樣，我到現在仍很討厭『醫院的味道』。只是孩子發燒、陪他去候診室，有時也會輕微作嘔。」"]},{"id":"phobia-32","no":32,"zh":"夢核恐懼","jp":"ドリームコアに対する恐怖心","en":"Paraoneirophobia","cat":"空間","desc":"對帶有懷舊感、模糊畫質與夢境氣氛的 Dreamcore 影像感到不安。","ex":"夢核圖片的例子","story":"論文作者主張，對夢核景象的恐懼應與一般夢境恐懼分開看待。","fullDesc":["對俗稱「好像在夢中見過的風景」的非現實景象「夢核」（Dreamcore）產生模糊不安和恐懼。這些景象常有某種色彩、令人懷舊。","定義並不明確，但往往具備：低解像度、畫質粗糙的獨特質感；即使飽和度有時較低，仍是有色彩而非黑白；能喚起懷舊或孤寂的元素。","不同於 Backrooms 封閉空間的恐懼，夢核亦包含草原、住宅區等開放空間。"],"fullExTitle":"「夢核」的例子","fullStory":["這些圖片刊載於某短期大學紀要論文《飽和度與雜訊對懷舊情緒的影響及世代分析——以Dreamcore的實例為對象》（《認知感性工學研究》9月號），被視為包含能喚起夢核感受的元素。","論文將夢核引發的恐懼稱為「並列的夢恐懼（Paraoneirophobia／パラオネイロフォビア）」，主張應與一般「夢」的恐懼分開看待。"]},{"id":"phobia-33","no":33,"zh":"鏡子恐懼症","jp":"鏡に対する恐怖心","en":"Catoptrophobia","cat":"空間","desc":"對鏡子、鏡面反射或鏡中自己的形象感到恐懼。","ex":"魔鏡啊魔鏡","story":"不明來源的 VHS 影片拍攝了屋內每一面被報紙與紙皮封住的鏡子。","fullDesc":["對鏡子及具有類似鏡面反射效果的物體產生過度焦慮與恐懼，也包括對「鏡中自己的樣子」的恐懼。","有人避開洗手盆或車上的鏡子；有人看到大廈窗戶映出自己，便停止思考和行動，對日常生活造成很大影響。"],"fullExTitle":"「魔鏡啊魔鏡」","fullStory":["這是女性電影評論作者在2000年代從跳蚤市場買到的VHS錄影帶，當時賣家也不知道來源。","影片中拍攝者走遍昏暗的民居，拍下屋裏每一面被報紙及紙皮嚴密封住的鏡子。","買下錄影帶的女性說：「我完全不知道那是在拍甚麼。但看拍攝者驚慌失措的樣子，以及錄影帶標籤寫着的東西，多少感覺得到那人就是極度『害怕鏡子』。」"]},{"id":"phobia-34","no":34,"zh":"幸福恐懼症","jp":"幸せに対する恐怖心","en":"Cherophobia","cat":"概念","desc":"在感受或表達幸福時產生焦慮、內疚與恐懼，甚至擔心幸福會傷害別人。","ex":"最後一篇投稿","story":"以不幸經歷聞名的網紅，被揭發所說的遭遇均為虛構後停止活動。","fullDesc":["在自己經歷幸福，或表達自己幸福時，產生帶有恐懼的負面情緒，如不安、罪惡感和不快。英語亦稱 Aversion to happiness（排斥幸福）。","可能涉及多種因素：「得到短暫幸福，代表終究會回到不幸，所以幸福最好一開始就少一點」；「一直幸福的人終會變成壞人，不幸的人反而品德清廉」的觀念；或「表達自己的幸福可能傷害別人」的潛在恐懼。","近年這是受到積極研究的恐懼主題之一。"],"fullExTitle":"最後一篇投稿","fullStory":["這是2019年至2021年活躍的網紅「みっちゃん@いつでも不幸」（小美＠永遠不幸）目前最後一篇公開投稿。","她以幽默方式寫日常抱怨和不幸，曾有數十萬追蹤者。","後來某揭露型網紅「爆料」指她的私生活和不幸身世全部虛構，社交媒體因「假裝不幸賺錢」（※）而炎上。她直到現在事實上仍停止活動。","※但目前尚未確認她曾從社交媒體貼文得到收入。"]},{"id":"phobia-35","no":35,"zh":"夢境恐懼症","jp":"夢に対する恐怖心","en":"Oneirophobia","cat":"概念","desc":"害怕夢境、做夢本身，甚至連睡覺也開始迴避。","ex":"夢境日記","story":"一名男學生持續記錄夢境多年，但惡夢與清醒夢頻率增加後，逐漸害怕入睡，最終停止記錄。","fullDesc":["對睡眠中所見的「夢」產生恐懼。可能因害怕做夢而連睡覺也害怕，擔心夢的內容或夢會對現實造成影響，於是傾向迴避就寢、睡眠。"],"fullExTitle":"夢境日記","fullStory":["這是一名現職地方公務員的男子，學生時代寫下的「夢境日記」部分頁面，逐一記錄做過的夢。","他大學時因為流行以夢境日記為主題的小說和遊戲，開始每天記錄夢境。","但某段時間後，惡夢、清醒夢愈來愈頻繁，使他連睡覺也感到害怕，最後停止記錄。","展出的頁面來自他持續約四年的日記，寫到第二年八個月時的部分。"]},{"id":"phobia-36","no":36,"zh":"幽靈恐懼症","jp":"幽霊に対する恐怖心","en":"Phasmophobia","cat":"概念","desc":"對幽靈、超自然現象及暗示其存在的影像產生強烈恐懼。","ex":"姊妹的家庭錄影帶","story":"兩姊妹在幼年錄影中突然朝房間同一方向哭喊「不要過來」。她們已不記得當時發生的事，成年後仍難以接觸恐怖題材。","fullDesc":["對幽靈、超自然現象，以及令自己聯想到它們的事物產生持續恐懼和焦慮。雖然怕鬼相當普遍，但也可能出現強烈而不由自主的拒絕反應。","例如白天看到恐怖片預告或怪談書封面，當晚就不能睡；看到兒童動畫裏令人聯想到幽靈的畫面，身體便僵硬。"],"fullExTitle":"姊妹的家庭錄影帶","fullStory":["這是一名東京都內出版社女性編輯提供的童年家庭錄影，拍下她和姐姐。","影片中，姊妹突然朝房間同一方向望去，哭着說「好可怕」，不回答母親的提問，還喊「不要過來」並逃走。","兩人完全不記得那時發生甚麼，但至今都非常害怕恐怖電影和遊戲。","她回憶說：「現在完全漆黑的話仍睡不着；盛夏熱得滿身汗，也絕對不能把腳伸出被子。丈夫偏偏一定要全黑才睡得着，只好請他忍耐。」"]},{"id":"phobia-37","no":37,"zh":"死亡恐懼症","jp":"死に対する恐怖心","en":"Thanatophobia","cat":"概念","desc":"害怕死亡、死後意識永久消失，以及所有令人想起死亡的事物。","ex":"死亡恐懼網誌","story":"一名家庭主婦記錄自己想到「永遠消失」時心臟緊縮、呼吸困難的感受。","fullDesc":["對死亡整個概念產生極度恐懼，不只是「死」本身，也包括任何會令人想到死亡的情況和迴避行為。","對死亡的模糊不安被放大，或童年創傷經歷（親近者離世、見過遺體等），都可能是間接原因。"],"fullExTitle":"記錄死亡恐懼的網誌","fullStory":["這是一名經營散文網誌的家庭主婦（依網誌記載，1989年出生）的文章。她經常寫到自己非常害怕「死」。","例如：「想到我會永遠消失，心臟就好像被緊緊揪住，呼吸困難，無法安靜坐着。」","文章流露出對「自己會死」，以及「死後意識永遠消失」這個概念本身的極度恐懼。"]},{"id":"phobia-38","no":38,"zh":"懷舊／鄉愁恐懼症","jp":"ノスタルジー(郷愁)に対する恐怖心","en":"Nostophobia","cat":"概念","desc":"害怕童年回憶、舊景物以及過去被現實改寫的可能。","ex":"被拆卸的遊樂設施","story":"退休男子重返家鄉，看到童年遊具已變得骯髒陌生，開始害怕其他美好回憶也被改寫。","fullDesc":["對過去回憶、童年，以及懷念的景物和物件產生模糊恐懼。","永遠回不到過去的失落感，或對古老事物的根源性不安，都可能成為觸發因素，使人害怕一切懷舊事物。"],"fullExTitle":"被拆除的遊樂設施","fullStory":["這件設施原本位於██縣███郡的公園，因內部零件老化而拆除。","一名退休後相隔數十年回鄉的男子說：「那設施從小時候就有，我也玩過。但公園離家遠，我又沒有孩子，幾十年沒見過。」","「拆除前重看，竟完全不覺得懷念。第一個感想是『好骯髒』，跟童年記憶完全不同。就像自己被重新改寫，非常奇怪。」","「從此我開始害怕以前玩過的設施、電影等各種懷舊東西。萬一以前美好的回憶，突然變成完全不同的東西怎麼辦？」"]},{"id":"phobia-39","no":39,"zh":"丟棄物品恐懼症","jp":"廃棄に対する恐怖心","en":"Disposophobia","cat":"概念","desc":"害怕丟棄物品或失去與物品相連的回憶，因此累積大量物品。","ex":"垃圾堆","story":"女大學生按照使用頻率保留一切，包括吃完的便當盒；她認為那些只是排序靠後的用品，而非垃圾。","fullDesc":["不論實際價值，對「丟棄或放棄擁有物品」產生強烈恐懼，因此傾向保存大量不需要的物品。","「將來可能用得到」、「丟掉會失去寶貴回憶」等觀念及情感依附，可能嚴重影響生活。"],"fullExTitle":"垃圾堆","fullStory":["這些是某大學城女大學生的單人公寓搬出的大量垃圾和生活用品的一部分。展出的照片，據她說是房間「還可以讓別人看」時的模樣。","冷藏食品盒、喝剩的罐、衣服、政府文件等，都按她自己的規則堆積。","她表示，物品以睡床為中心，按照「使用頻率由高至低」排列。吃完的便利店便當盒，不是垃圾，而是「使用頻率排在很後面的東西」。","因此照她的邏輯，這間房理論上已連續好幾年沒有產生「廢棄物」。","這次因她搬回父母家，房間必須清理，她同意將部分搬出的東西提供給展覽。朋友說：「她本人其實是個外表整潔的普通人。」"]},{"id":"phobia-40","no":40,"zh":"無限恐懼症","jp":"無限に対する恐怖心","en":"Apeirophobia","cat":"概念","desc":"對永恆、無限，或近乎永無盡頭的時間感到恐懼。","ex":"關於地獄的故事","story":"佛教幼稚園播放講述無間地獄極長刑期的教育錄影帶，據舊生回憶評價非常差。","fullDesc":["對無限、永恆概念產生強烈恐懼。","就算不是數學上的無限，若感覺實際上永不結束，也可能產生相同恐懼。例如網上著名的「保持清醒意識，在空無一物之處度過五億年」，或「時間感拉長，短短五分鐘感覺過了三十天」。"],"fullExTitle":"關於地獄的故事","fullStory":["這是一卷某佛教幼稚園保存作視聽教材的錄影帶。","佛教所說的地獄之中，「無間地獄」的刑期被描述為「一中劫」；「劫」是一種漫長得近乎無限的時間單位。","錄影帶據說用作告誡孩子「不要做壞事」。一名十六年前從該幼稚園畢業的女性說，錄影帶「評價非常差」。"]},{"id":"phobia-41","no":41,"zh":"時間恐懼症","jp":"時間に対する恐怖心","en":"Chronophobia","cat":"概念","desc":"對時間流逝、未來及時間的存在本身感到持續恐懼。","ex":"報時","story":"一名女子因害怕時間不知不覺流逝，開始用大音量不斷播放報時錄音。","fullDesc":["對時間流逝本身或未來產生持續恐懼，特徵是單單意識到「時間」也會害怕或不快。","長期住院的人、有因時間流逝導致離別的深刻創傷者，或服刑中的囚犯，也可能有類似恐懼。"],"fullExTitle":"「報時」","fullStory":["這是一名曾住在██縣某公寓、職業不詳的女性，某時期開始大聲播放的報時錄音。","從舊收錄機不斷傳出平淡報讀「時間」的聲線，當時幾乎所有鄰居都聽過。","在她開始播放前，有些曾與她打招呼、閒聊的住戶，經常聽她抱怨：「最近愈來愈健忘，經常回過神來才發現時間已過去。」"]},{"id":"phobia-42","no":42,"zh":"罪惡恐懼症","jp":"罪悪に対する恐怖心","en":"Hamartophobia","cat":"概念","desc":"極度害怕自己的行為在無意間傷害別人，即使沒有客觀過錯也難以安心。","ex":"致各位","story":"一名女子以 24 小時固定鏡頭直播自己的生活，請觀眾確認她沒有做任何會傷害別人的事。說明文字描述從小時候紙張割傷同學開始，她如何畏懼自己成為「加害者」，甚至害怕自己的恐懼會觸發他人的恐懼。","fullDesc":["對作出道德上不正確的行為，或因此傷害別人，產生過度、不合理的恐懼與預期性焦慮。","即使客觀上根本沒有犯錯，或事情非常輕微，也可能因根深蒂固的自我懲罰式道德標準、過去的教育背景或創傷，不斷害怕「我可能正在傷害別人」。"],"fullExTitle":"「致各位」","fullStory":["這是以《致各位》為題，在網絡直播平台播出的影片。固定鏡頭24小時拍攝一名女性在公寓房間裏生活，在部分網絡社群引起「神秘直播」的討論。","### 【直播說明全文】","小時候，有一次班上換座位，我被安排坐在從前面數第二排的位置。傳講義給後面同學時，紙張被拉得筆直，割傷了準備接過講義的朋友的手指。","白色講義沾了血，附近同學去叫老師，事情一下子鬧大。小息時那個同學到保健室貼上膠布。","那個同學說「沒關係，我沒事」，可是沾血的紙巾就放在筆袋旁邊。那張皺巴巴的紙，每一道皺紋都好像在責怪我。","我不是說，所有事情都是那次意外造成的。但幾年後上了中學，我已經無法在別人面前拿着東西。","非拿不可時，我就會把東西牢牢抱在胸前，注意不要超出肩膀與胸口的寬度，像擁抱一樣緊緊抱住。","在圖書館拿書時，只要想到萬一掉下來，就幾乎想哭。所以暑假前必須借書、或做資料搜集功課的時候，我都非常鬱悶。","掉下來的書打中別人當然不可以；即使沒有打中任何人，圖書館那麼安靜，如果我弄出很大聲響，令別人不舒服怎麼辦？我總是一邊深呼吸一邊拿書。","我有個朋友害怕恐怖電影，總說很討厭那些突然用大聲響嚇人的橋段。所以我會想，若那朋友剛好在場，知道是我把書掉在地上，也許會看不起我。（即使不是那個朋友，世上也一定有很多相似的人。）","出門時，我會緊握雙手，或雙臂交叉、像抓着自己的手臂那樣走。每次與人擦身而過，就握得更緊；特別是秋冬，皮膚經常剝落、流血。","手掌拇指下方隆起的地方，總像水泡一樣破損、滲液。看見傷痕，我就覺得這證明自己今天也沒有傷害任何人，能稍微安心。","我第一次知道「恐懼症」這個詞，是中學一年級時。當時我想找找有沒有其他人也抱着相似的恐懼，於是找到一些「恐懼症一覽」網站。","看到後才知道，原來有那麼多人，正因各種我不知道的事物真切地受苦。","有人害怕密集物體，無意間看到雨滴圖片就想吐；有人害怕死亡，朋友一談將來的夢想或昔日回憶，便會想到那些事情之後的死亡而感到不安。我至今記得當時受到的衝擊。","世界上有那麼多恐懼的觸發因素，而究竟哪一個是某人的「地雷」，不真正踩下去根本不會知道。那時我清楚明白了這件事。","我覺得這非常可怕。因為若自己的行為恰巧成為某人的觸發因素，可能扭曲別人的一生；而反過來的情況當然也有可能。","所以，也許人們才會替各種恐懼命名，試圖避免踩中別人的地雷。","那時我隱約理解，為何世界上有那麼多叫作「恐懼症」的東西。我認為，恐懼症存在，不是因為人們不想害怕，而是因為人們不想讓別人害怕自己。","於是我研究很多事情，向老師求助。大家都說「那種事不用害怕」，說社會原本就靠互相妥協運作，大家其實比想像中寬容，想讓我放心。","但我忍不住覺得，那到頭來不就等於「你是加害者，只是大家都選擇沉默」嗎？（我當然知道他們並無惡意，是真心想安慰我。）","即使有人說「肯定有人會對你有壞印象，但不會說出口，所以放心」，我害怕的正是「有人會這樣想我」，害怕自己可能在不知不覺間做壞事。","所以這樣的話反而好像證實了我的擔憂，令我愈來愈覺得無處可逃。","難道我是害怕「恐懼症」本身？但似乎又不完全對。我害怕的與其說是恐懼症，不如說是產生恐懼症的「恐懼心」，更進一步是把別人看成那樣的「我」的加害性。","若恐懼對象是看得見的東西，至少可以遠離，採取戰鬥或逃跑反應。","可是，如果害怕的是「我」自己的內心，那麼這樣的自己能逃到哪裏去？最近我淨是想着這些事。","於是，我認為現在能做的，至少是為了避免再傷害任何人，讓別人看着我。","所以我決定開始直播。","承受看不見的視線很可怕。前年老師也曾暗示我似乎有嚴重的視線恐懼症。","但如果我的目光有可能令別人害怕，那麼讓除自己之外所有人感到恐懼的可能性變為零，對我而言反而輕鬆得多，也更有價值。","如果有人正在看這場直播，拜託你們。","即使只有幾秒鐘，也請看着我，確認我「甚麼都沒有做」。","我想讓自己相信沒有傷害任何人，從而安心。","我明白這沒有解決任何問題，只是自我滿足。這和在掌心留下指甲痕跡、因疼痛而感到安心，根本沒有兩樣。我都知道。","但我仍覺得，為了讓「我」能與這份恐懼共處，目前除了持續意識到恐懼，透過確認自己正在受苦而安心，似乎沒有其他辦法。","拜託你們了。","對不起。"]},{"id":"phobia-43","no":43,"zh":"恐懼本身恐懼症","jp":"恐怖心に対する恐怖心","en":"Phobophobia","cat":"概念","desc":"害怕自己產生恐懼，或讓別人感到恐懼；是對恐懼這種內在心理活動的後設認知性焦慮。","ex":"無標題","story":"毫無防備地接觸某種恐懼，有時反而會令人開始害怕「恐懼心」這種內心活動本身。","fullDesc":["對承受一切恐懼的「內心」本身產生的恐懼。對「自己會感受到恐懼／令別人感到恐懼」這件事本身，產生後設認知式預期性焦慮。"],"fullExTitle":"（原文無展品標題）","fullStory":["在毫無防備的情況下接觸某種恐懼，有時會使人開始害怕「恐懼心」這種內心活動本身。"]}];const CATS={"存在": "存在に対する恐怖心", "社會": "社会に対する恐怖心", "空間": "空間に対する恐怖心", "概念": "概念に対する恐怖心"};const nav=document.getElementById('nav'),sect=document.getElementById('sections'),filters=document.getElementById('filters'),side=document.getElementById('side');let active='全部';const clean=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function linesToHTML(lines){return lines.map(t=>`<p>${clean(t)}</p>`).join('')}function build(){let out='',nn='';Object.keys(CATS).forEach(cat=>{const xs=ITEMS.filter(x=>x.cat===cat);out+=`<div class="chapter" id="category-${cat}">${cat}｜${CATS[cat]}</div>`;nn+=`<div class="navgroup">${cat} — ${CATS[cat]}</div>`;xs.forEach(x=>{out+=`<article class="entry" id="${x.id}" data-cat="${x.cat}" data-text="${clean([x.zh,x.jp,x.en,x.fullDesc.join(' '),x.fullExTitle,x.fullStory.join(' ')].join(' ').toLowerCase())}"><div class="num">作品 ${String(x.no).padStart(2,'0')}</div><h2>${clean(x.zh)}</h2><div class="jp">${clean(x.jp)}</div><div class="en">${clean(x.en)}</div><div class="content">${linesToHTML(x.fullDesc)}</div><h3>展品：${clean(x.fullExTitle)}</h3><div class="content">${linesToHTML(x.fullStory)}</div><a href="https://kyoufushin.com/caption-5c2c9901cdff/works/${x.no}/" target="_blank" rel="noopener noreferrer">日文原文 ↗</a>　<button class="copy" data-url="${x.id}">複製本節連結</button> <a class="back" href="#top">↑ 返回目錄</a></article>`;nn+=`<a class="navitem" href="#${x.id}" data-cat="${cat}" data-text="${clean([x.zh,x.jp,x.en].join(' ').toLowerCase())}">${String(x.no).padStart(2,'0')}　${clean(x.zh)}</a>`;});});sect.innerHTML=out;nav.innerHTML=nn;filters.innerHTML=['全部',...Object.keys(CATS)].map(c=>`<button data-cat="${c}" class="${c==='全部'?'active':''}">${c}</button>`).join('');}function update(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.entry').forEach(e=>{e.classList.toggle('hidden',(active!=='全部'&&e.dataset.cat!==active)||!e.dataset.text.includes(q))});document.querySelectorAll('.navitem').forEach(e=>{e.classList.toggle('hidden',(active!=='全部'&&e.dataset.cat!==active)||!e.dataset.text.includes(q))});document.querySelectorAll('.chapter').forEach(e=>{let entries=[...e.nextElementSibling.parentElement.querySelectorAll('.entry')];const cat=e.id.replace('category-','');e.classList.toggle('hidden',![...document.querySelectorAll('.entry')].some(v=>v.dataset.cat===cat&&!v.classList.contains('hidden')))});document.querySelectorAll('.navgroup').forEach(e=>{let next=e.nextElementSibling,has=false;while(next&&!next.classList.contains('navgroup')){if(!next.classList.contains('hidden'))has=true;next=next.nextElementSibling}e.classList.toggle('hidden',!has)});}build();document.getElementById('search').addEventListener('input',update);filters.addEventListener('click',e=>{if(e.target.dataset.cat){active=e.target.dataset.cat;filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.cat===active));update()}});document.getElementById('menu').onclick=()=>side.classList.toggle('open');nav.addEventListener('click',()=>side.classList.remove('open'));document.addEventListener('click',e=>{if(e.target.classList.contains('copy')){const url=location.href.split('#')[0]+'#'+e.target.dataset.url;navigator.clipboard?.writeText(url).then(()=>{e.target.textContent='已複製';setTimeout(()=>e.target.textContent='複製本節連結',1200)}).catch(()=>prompt('複製以下連結：',url));}});window.addEventListener('hashchange',()=>{const a=document.querySelector(location.hash);if(a&&a.classList.contains('hidden')){active='全部';document.getElementById('search').value='';filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.cat==='全部'));update()}});</script></body></html>
